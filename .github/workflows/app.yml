name: app

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # the default also asks for the legacy "tools" package, which the SDK repository no longer has
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      # buildSrc is a separate build, so its tests (release signing settings) run on their own.
      - run: ./gradlew -p buildSrc test --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/app/build/reports/tests/
            app/buildSrc/build/reports/tests/

  app-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:lintDebug --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/app/build/reports/lint-results-debug.*

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      # Unsigned: no key in CI. Shrinking with R8 and lint on the release variant catch release-only breakage.
      - run: ./gradlew :app:bundleRelease :app:assembleRelease :app:lintRelease --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-release
          path: app/app/build/reports/lint-results-release.*
