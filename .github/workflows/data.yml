name: data

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: data

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The app bundles data/out; it must be exactly what the pipeline builds from source + overrides.
  dataset-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/pyproject.toml
      - run: pip install -e .
      - run: python -m pipeline build --strict
      - name: data/out matches the committed files
        run: |
          if ! git diff --exit-code --stat -- out/; then
            echo "::error::data/out is stale: run 'python -m pipeline build --strict' in data/ and commit the result"
            exit 1
          fi

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
