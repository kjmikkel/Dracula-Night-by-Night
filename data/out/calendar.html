<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry Calendar</title>
<style>
:root {
  --bg: #f4ecdc; --panel: #fbf6ec; --ink: #2a1f1a; --muted: #75655a; --line: #dccdb4;
  --accent: #7a1f24; --accent-soft: #f0d9d4;
  --day: 26px;      /* width of one day; every day is the same */
  --chart: 240px;   /* height of the tallest bar */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141011; --panel: #1d1718; --ink: #ece2d4; --muted: #a39282; --line: #3a2e2c;
    --accent: #d06a6a; --accent-soft: #3a1f21;
  }
}
:root[data-theme="dark"] {
  --bg: #141011; --panel: #1d1718; --ink: #ece2d4; --muted: #a39282; --line: #3a2e2c;
  --accent: #d06a6a; --accent-soft: #3a1f21;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Georgia, "Times New Roman", serif; width: max-content; min-width: 100%; }
header { position: sticky; left: 0; width: 100vw; padding: 20px 16px 8px; }
h1 { margin: 0; font-size: 1.5rem; }
.sub { color: var(--muted); margin: 2px 0 0; }
.hint { color: var(--muted); font-size: .8rem; margin: 0; }
.line { display: flex; padding: 24px 16px 32px; }
.day { width: var(--day); flex: none; display: flex; flex-direction: column; align-items: center; }
.plot { height: calc(var(--chart) + 18px); width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; border-bottom: 1px solid var(--line); }
.day.sun .plot { background: var(--panel); }
.bar { width: 60%; background: var(--accent); border-radius: 3px 3px 0 0; }
.c { font-size: .7rem; font-weight: bold; color: var(--accent); line-height: 18px; }
.n { font-size: .68rem; color: var(--muted); margin-top: 3px; }
.day.first { border-left: 1px solid var(--muted); }
.day.first .plot { border-left: 0; }
.m { height: 20px; align-self: flex-start; padding-left: 4px; font-size: .8rem; font-weight: bold; white-space: nowrap; }
.day.has:hover .bar { filter: brightness(1.25); }
.err { color: var(--accent); padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>Entries per day</h1>
  <p class="sub" id="sub">Loading entries.json…</p>
  <p class="hint">Scroll sideways (the mouse wheel works too). Hover a bar for the day's entries.</p>
</header>
<div class="line" id="line"></div>
<script>
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_MS = 86400000;

// How tall a day's bar is, as a fraction (0..1) of the chart height.
function barHeight(count, max) {
  return count / max;
}

function render(entries) {
  const byDate = new Map();
  for (const e of entries) {
    if (!e.date) continue;
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }
  const dates = [...byDate.keys()].sort();
  const max = Math.max(...[...byDate.values()].map(v => v.length));
  const y0 = Number(dates[0].slice(0, 4));
  const y1 = Number(dates[dates.length - 1].slice(0, 4));
  const years = y0 === y1 ? `${y0}` : `${y0}–${y1}`;

  document.getElementById("sub").textContent =
    `${entries.length} entries on ${dates.length} days in ${years} · busiest day has ${max}`;

  const line = document.getElementById("line");
  const chart = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--chart"));
  const end = Date.UTC(y1, 11, 31);
  let firstEntryCell = null;

  for (let t = Date.UTC(y0, 0, 1); t <= end; t += DAY_MS) {
    const dt = new Date(t);
    const y = dt.getUTCFullYear(), m = dt.getUTCMonth(), d = dt.getUTCDate();
    const iso = dt.toISOString().slice(0, 10);
    const list = byDate.get(iso) || [];

    const cell = document.createElement("div");
    cell.className = "day" + (d === 1 ? " first" : "") + (dt.getUTCDay() === 0 ? " sun" : "") + (list.length ? " has" : "");
    let plot = "";
    if (list.length) {
      const h = Math.max(4, barHeight(list.length, max) * chart);
      plot = `<span class="c">${list.length}</span><div class="bar" style="height:${h}px"></div>`;
      const types = {};
      for (const e of list) types[e.type] = (types[e.type] || 0) + 1;
      cell.title = `${d} ${MONTHS[m]} ${y}: ${list.length} entr${list.length === 1 ? "y" : "ies"}\n` +
        Object.entries(types).map(([k, n]) => `${n} × ${k}`).join("\n");
      firstEntryCell ??= cell;
    }
    cell.innerHTML = `<div class="m">${d === 1 ? MONTHS[m] + (m === 0 ? " " + y : "") : ""}</div>` +
      `<div class="plot">${plot}</div><span class="n">${d}</span>`;
    line.appendChild(cell);
  }

  // Start the view a little before the first entry rather than on empty January.
  if (firstEntryCell) window.scrollTo({ left: Math.max(0, firstEntryCell.offsetLeft - 120) });
}

// The page is wide, not tall: let a plain vertical wheel scroll sideways.
window.addEventListener("wheel", e => {
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  window.scrollBy({ left: e.deltaY });
  e.preventDefault();
}, { passive: false });

fetch("entries.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(err => {
    document.getElementById("sub").textContent = "";
    document.getElementById("line").innerHTML =
      `<p class="err">Couldn't load entries.json (${err.message}). Serve data/out over HTTP, e.g. the "review" launch config.</p>`;
  });
</script>
</body>
</html>
