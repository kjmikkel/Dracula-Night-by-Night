[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dracula-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4==4.12.3", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
