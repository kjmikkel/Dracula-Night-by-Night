# Robolectric 4.16 knows Android up to 36; the app targets 37. The ratchet only needs a recent framework.
sdk=36
# The spike's emulator: a 1080 x 2400 phone at 420 dpi.
qualifiers=w411dp-h914dp-xxhdpi
# Not the real DraculaApp: its container starts background work (rescheduling the alarm) that outlives each test and
# throws into the next one. Tests build their own app (a11y/Harness.kt testApp()).
application=android.app.Application
